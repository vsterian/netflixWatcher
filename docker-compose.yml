services:
  netflixwatcher:
    build: .
    container_name: netflixwatcher
    restart: always
    env_file:
      - .env
    volumes:
      - type: bind
        source: /var/lib/rpi-observability/apps/netflix-watcher
        target: /metrics

  scheduler:
    image: docker:cli
    container_name: netflixwatcher_scheduler
    restart: unless-stopped
    command: ["sh", "/scheduler.sh"]
    volumes:
      - ./Setup/netflixwatcher_scheduler.sh:/scheduler.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /var/lib/rpi-observability/apps/netflix-watcher
        target: /metrics
