name: Build and Push to Raspberry PI

on:
  push:
    branches: main
  workflow_dispatch:

env:
  #REGISTRY_NAME: <your-acr-registry>  # replace with your ACR name
  SSH_PORT: 21
  CONTAINER_NAME: netflixwatcher

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r app/requirements.txt
    - run: python -m unittest discover -s tests
    - run: |
        install -m 600 /dev/null .env
        docker compose config --quiet
    - run: shellcheck Setup/*.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Configure Raspberry Pi deployment key
      env:
        RPI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
      run: |
        install -m 600 /dev/null "$RUNNER_TEMP/rpi_deploy_key"
        printf '%s\n' "$RPI_SSH_KEY" > "$RUNNER_TEMP/rpi_deploy_key"
   
    # Copy repository to Raspberry Pi
    - name: Copy Repository to Raspberry Pi
      run: |
        rsync -avz \
        -e "ssh -i $RUNNER_TEMP/rpi_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -p ${{ env.SSH_PORT }}" ./ \
        ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }}:/home/${{ secrets.SSH_USER }}/repos/netflixWatcher/

    # Run docker compose on Raspberry Pi
    - name: Run Docker Compose on Raspberry Pi
      run: |
        ssh -i "$RUNNER_TEMP/rpi_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -p ${{ env.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }} << EOF
          cd /home/${{ secrets.SSH_USER }}/repos/netflixWatcher
          docker compose up -d --build
          for attempt in 1 2 3 4 5 6; do
            if test -s /var/lib/rpi-observability/apps/netflix-watcher/netflix-watcher.prom && \
               test -s /var/lib/rpi-observability/apps/netflix-watcher/netflix-watcher-scheduler.prom; then
              exit 0
            fi
            sleep 5
          done
          echo "Netflix Watcher observability metrics were not published" >&2
          exit 1
        EOF
