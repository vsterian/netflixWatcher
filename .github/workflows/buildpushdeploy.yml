name: Build and Push to Raspberry PI

on:
  push:
    branches: main
  workflow_dispatch:

env:
  #REGISTRY_NAME: <your-acr-registry>  # replace with your ACR name
  SSH_PORT: 22
  CONTAINER_NAME: netflixwatcher

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r app/requirements.txt
    - run: python -m unittest discover -s tests
    - run: |
        install -m 600 /dev/null .env
        docker compose config --quiet
    - run: shellcheck Setup/*.sh

  build-and-push:
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Join private deployment network
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
      with:
        oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
        audience: ${{ vars.TS_AUDIENCE }}
        tags: tag:pi-ci
        version: 1.104.2

    - name: Verify deployment network isolation
      run: |
        timeout 30 bash -c 'until nc -z -w 2 100.109.96.69 22; do sleep 1; done'
        for endpoint in 100.109.96.69:8086 100.107.226.36:22 192.168.0.207:80; do
          if nc -z -w 3 "${endpoint%:*}" "${endpoint##*:}"; then
            echo "CI has unexpected network access: $endpoint" >&2
            exit 1
          fi
        done

    - name: Configure Raspberry Pi deployment key
      env:
        RPI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
      run: |
        install -d -m 700 "$HOME/.ssh"
        install -m 600 .github/pi_known_hosts "$HOME/.ssh/known_hosts"
        install -m 600 /dev/null "$RUNNER_TEMP/rpi_deploy_key"
        printf '%s\n' "$RPI_SSH_KEY" > "$RUNNER_TEMP/rpi_deploy_key"
   
    # Copy repository to Raspberry Pi
    - name: Copy Repository to Raspberry Pi
      run: |
        rsync -avz \
        -e "ssh -i $RUNNER_TEMP/rpi_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p ${{ env.SSH_PORT }}" --exclude='.git' --exclude='.env' ./ \
        ${{ secrets.SSH_USER }}@100.109.96.69:/home/${{ secrets.SSH_USER }}/repos/netflixWatcher/

    # Run docker compose on Raspberry Pi
    - name: Run Docker Compose on Raspberry Pi
      run: |
        ssh -i "$RUNNER_TEMP/rpi_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p ${{ env.SSH_PORT }} ${{ secrets.SSH_USER }}@100.109.96.69 'bash -se' << 'EOF'
          set -eu
          mkdir -p "$HOME/.cache"
          exec 9>"$HOME/.cache/pi-deploy.lock"
          flock -w 1800 9
          cd /home/${{ secrets.SSH_USER }}/repos/netflixWatcher
          docker compose up -d --build
          for attempt in 1 2 3 4 5 6; do
            if test -s /var/lib/rpi-observability/apps/netflix-watcher/netflix-watcher.prom && \
               test -s /var/lib/rpi-observability/apps/netflix-watcher/netflix-watcher-scheduler.prom; then
              exit 0
            fi
            sleep 5
          done
          echo "Netflix Watcher observability metrics were not published" >&2
          exit 1
        EOF

    - name: Remove deployment key
      if: always()
      run: rm -f "$RUNNER_TEMP/rpi_deploy_key"
